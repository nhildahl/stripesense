<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fe0"/>
      <stop offset="0.55" stop-color="#1c5fa8"/>
      <stop offset="1" stop-color="#0c2748"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="0.55" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#ff9a1a"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf1"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04142a" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2a52" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- sky -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- sun with rays, rising behind the slip -->
    <g transform="translate(372 138)">
      <g fill="#ffd23f" opacity="0.9">
        <path d="M0 -112 L11 -78 L-11 -78 Z"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(30)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(60)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(90)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(120)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(150)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(180)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(210)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(240)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(270)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(300)"/>
        <path d="M0 -112 L11 -78 L-11 -78 Z" transform="rotate(330)"/>
      </g>
      <circle r="66" fill="url(#sun)"/>
    </g>

    <!-- the time slip -->
    <g transform="rotate(-8 240 300)" filter="url(#shadow)">
      <path d="M128 150 H352 V452 L337 466 L322 452 L307 466 L292 452 L277 466 L262 452 L247 466 L232 452 L217 466 L202 452 L187 466 L172 452 L157 466 L142 452 L128 466 Z" fill="url(#paper)"/>
      <!-- finish-line checker band -->
      <g fill="#14181d">
        <rect x="128" y="150" width="16" height="12"/><rect x="160" y="150" width="16" height="12"/><rect x="192" y="150" width="16" height="12"/><rect x="224" y="150" width="16" height="12"/><rect x="256" y="150" width="16" height="12"/><rect x="288" y="150" width="16" height="12"/><rect x="320" y="150" width="16" height="12"/>
        <rect x="144" y="162" width="16" height="12"/><rect x="176" y="162" width="16" height="12"/><rect x="208" y="162" width="16" height="12"/><rect x="240" y="162" width="16" height="12"/><rect x="272" y="162" width="16" height="12"/><rect x="304" y="162" width="16" height="12"/><rect x="336" y="162" width="16" height="12"/>
      </g>
      <!-- slip numbers -->
      <g font-family="Consolas, 'Courier New', monospace" font-size="25" fill="#2b3440" font-weight="700">
        <text x="146" y="214">60'</text><text x="334" y="214" text-anchor="end">1.436</text>
        <text x="146" y="252">330'</text><text x="334" y="252" text-anchor="end">4.205</text>
        <text x="146" y="290">1/8</text><text x="334" y="290" text-anchor="end">6.031</text>
        <text x="146" y="328">1000'</text><text x="334" y="328" text-anchor="end">7.556</text>
      </g>
      <rect x="138" y="342" width="206" height="44" rx="8" fill="#1fbf5f"/>
      <g font-family="Consolas, 'Courier New', monospace" font-weight="800" fill="#ffffff">
        <text x="148" y="374" font-size="28">ET</text><text x="334" y="374" font-size="30" text-anchor="end">8.900</text>
      </g>
      <g font-family="Consolas, 'Courier New', monospace" font-size="25" fill="#2b3440" font-weight="700">
        <text x="146" y="424">MPH</text><text x="334" y="424" text-anchor="end">174.52</text>
      </g>
    </g>

    <!-- cloud drifting across the corner of the slip and the sun -->
    <g filter="url(#soft)" transform="translate(328 124) scale(0.86)">
      <path d="M-62 48 C-98 48 -104 4 -72 -4 C-74 -38 -30 -54 -8 -30 C4 -66 62 -66 70 -22 C102 -26 118 12 96 30 C108 48 92 62 72 60 L-58 60 C-70 60 -76 54 -62 48 Z" fill="url(#cloud)"/>
    </g>
  </g>
</svg>
